# OpenInvar's constraints on itself.
#
# Committed on purpose: these are the repository's architectural boundaries,
# and a constraint nobody can read is not a constraint. The graph database
# lives in .openinvar/, which is gitignored — this file does not.
#
# `openinvar check .` evaluates everything here. CI runs it with
# fail-on-violation, so a change that breaks one of these does not merge.

# ── crate layering ───────────────────────────────────────────
#
# The whole stack, outermost first. A crate may depend downward and never
# upward, which states the real dependency direction in one rule instead of
# the ten forbid-dependency pairs it would otherwise take.
#
# lang and store both sit above core and neither uses the other, so their
# order here is what forbids lang from reaching into persistence.

[[rule]]
name = "crate-layering"
kind = "layers"
layers = [
  "crates/openinvar-cli/**",     # the binary — may reach everything
  "crates/openinvar-mcp/**",
  "crates/openinvar-store/**",
  "crates/openinvar-lang/**",
  "crates/openinvar-core/**",    # the engine — depends on nothing here
]
severity = "error"

# ── coupling ─────────────────────────────────────────────────
#
# Advisory, and deliberately set above what this repository already has.
#
# A high fan-in is frequently correct. The three highest here are
# RelationshipKind (184), InvarGraph (126) and SymbolKind (101) — the edge-kind
# enum, the graph type, and the symbol-kind enum. Each is a hub because it is
# supposed to be one.
#
# A threshold below those would fire on all three from the first run, and a
# rule that is violated on day one is a rule somebody raises until it means
# nothing. The number sits above the real maximum, so this fires when something
# *new* climbs into that class, which is the only version of this rule worth
# having.
#
# Raise it when a hub is genuinely justified; do not raise it to silence one.
#
# It moved from 180 to 200 when Java was promoted to Tier 1, and that is the
# justified case rather than the silencing one: every Tier 1 adapter matches on
# the relationship vocabulary, so RelationshipKind gains about fifteen
# references per language — 169 to 184 for Java. The figure therefore tracks
# the language count by design, and 200 leaves room for one more before it
# needs looking at again.
#
# The better fix is a scope or exclusion on max-fan-in, so a named hub can be
# exempted without lifting the ceiling for everything. The rule takes only a
# threshold today; until it takes more, this number has to move.

# `warn` is the default for the fan rules, so it is not repeated here.

[[rule]]
name = "no-new-god-symbol"
kind = "max-fan-in"
threshold = 200
