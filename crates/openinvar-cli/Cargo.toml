[package]
name = "openinvar-cli"
description = "The OpenInvar CLI — audit a change, check it against rules, and query the graph behind both"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[[bin]]
name = "openinvar"
path = "src/main.rs"

[features]
# One released binary, carrying every language. `--no-default-features
# --features python` still builds a Python-only `openinvar` — the per-language
# features are what a source install and the per-language CI job use, and only
# the release artifact collapsed.
default = ["full"]
full = ["tier1", "java", "ruby", "csharp"]
tier1 = ["typescript", "python", "rust", "go", "c"]
typescript = ["openinvar-lang/typescript", "openinvar-mcp/typescript"]
python = ["openinvar-lang/python", "openinvar-mcp/python"]
rust = ["openinvar-lang/rust", "openinvar-mcp/rust"]
go = ["openinvar-lang/go", "openinvar-mcp/go"]
c = ["openinvar-lang/c", "openinvar-mcp/c"]
java = ["openinvar-lang/java", "openinvar-mcp/java"]
ruby = ["openinvar-lang/ruby", "openinvar-mcp/ruby"]
csharp = ["openinvar-lang/csharp", "openinvar-mcp/csharp"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
openinvar-core = { path = "../openinvar-core", version = "0.2.0" }
openinvar-lang = { path = "../openinvar-lang", version = "0.2.0", default-features = false }
openinvar-store = { path = "../openinvar-store", version = "0.2.0" }
openinvar-mcp = { path = "../openinvar-mcp", version = "0.2.0", default-features = false }

[dev-dependencies]
walkdir = "2"
serde_json = "1"
