[package]
name = "openinvar-mcp"
description = "MCP server for OpenInvar — exposes its audit, check, and graph tools to coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
# Forwarded to openinvar-lang so a slim build stays slim all the way to the
# binary. Without this the CLI could pull every grammar back in through its
# dependency on the MCP server.
default = ["full"]
full = ["tier1", "ruby"]
tier1 = ["typescript", "python", "rust", "go", "c", "java", "csharp"]
typescript = ["openinvar-lang/typescript"]
python = ["openinvar-lang/python"]
rust = ["openinvar-lang/rust"]
go = ["openinvar-lang/go"]
c = ["openinvar-lang/c"]
java = ["openinvar-lang/java"]
ruby = ["openinvar-lang/ruby"]
csharp = ["openinvar-lang/csharp"]

[dependencies]
rmcp = { version = "1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
openinvar-core = { path = "../openinvar-core", version = "0.3.0" }
openinvar-lang = { path = "../openinvar-lang", version = "0.3.0", default-features = false }
openinvar-store = { path = "../openinvar-store", version = "0.3.0" }

[dev-dependencies]
openinvar-core = { path = "../openinvar-core", version = "0.3.0" }
