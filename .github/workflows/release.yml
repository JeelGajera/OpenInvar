name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag name to attach these binaries to (e.g., v0.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: openinvar
            asset_name: openinvar-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: openinvar
            asset_name: openinvar-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: openinvar.exe
            asset_name: openinvar-x86_64-pc-windows-msvc.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Binary
        run: cargo build --locked --release -p openinvar-cli --target ${{ matrix.target }}

      - name: Package Release (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} .
          tar -czf ${{ matrix.asset_name }} ${{ matrix.artifact_name }} README.md LICENSE

      - name: Package Release (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target\${{ matrix.target }}\release\${{ matrix.artifact_name }}, README.md, LICENSE -DestinationPath ${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
          files: ${{ matrix.asset_name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
