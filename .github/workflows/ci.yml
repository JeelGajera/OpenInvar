name: CI

on:
  push:
    branches: [main, master]
  # Every pull request, whatever it targets. Restricting this to main and
  # master meant a pull request based on another pull request's branch got no
  # checks at all — not a failure, no runs — so a stacked series would reach
  # the default branch having never been tested as it was reviewed.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CC: gcc-13
  CXX: g++-13

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install gcc-13
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace

      # Determinism is the property every other claim rests on: you cannot gate
      # CI on a graph that disagrees with itself between runs. The golden tests
      # cover each fixture; this covers the largest polyglot repository to hand,
      # which is OpenInvar itself. It reuses the binary `cargo test` already
      # built, so it costs a fraction of a second.
      #
      # `language_stats` was a `HashMap` and serialized in a different order on
      # every run. Nothing caught it because nothing compared two runs.
      - name: Verify analysis is reproducible
        run: |
          cargo build -p openinvar-cli
          ./target/debug/openinvar analyze . --json > /tmp/analysis-1.json
          ./target/debug/openinvar analyze . --json > /tmp/analysis-2.json
          if ! cmp -s /tmp/analysis-1.json /tmp/analysis-2.json; then
            echo "::error::two analyses of identical input produced different output"
            diff /tmp/analysis-1.json /tmp/analysis-2.json | head -40
            exit 1
          fi
          echo "reproducible: $(wc -c < /tmp/analysis-1.json) bytes, byte-identical across two runs"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # A language is a Cargo feature, so every language must also build with
      # only itself enabled. The default build carries five of them, and code
      # that compiles because some *other* language pulled in a name compiles
      # nowhere else — a slim binary is what a user gets when they build for
      # one language, and it is the shape the publish job ships.
      #
      # Both failures this catches were invisible to `--workspace`: a `match`
      # whose every arm was cfg'd out left a `Vec` with no inferrable element
      # type, and a test gated on a non-default feature carried an unused
      # import that only that feature's build ever compiled. Neither had
      # anything to do with the language whose build broke.
      #
      # The list comes from the crate's own features rather than being spelled
      # out here, so adding a language is covered without remembering to add it
      # in two places.
      - name: Clippy each language on its own
        run: |
          languages=$(python3 - <<'EOF'
          import json, subprocess

          meta = json.loads(subprocess.run(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"],
              capture_output=True, text=True, check=True).stdout)
          lang = next(p for p in meta["packages"] if p["name"] == "openinvar-lang")
          print(" ".join(sorted(
              f for f in lang["features"] if f not in ("default", "full"))))
          EOF
          )
          echo "languages: $languages"
          status=0
          for language in $languages; do
            echo "::group::openinvar-lang --features $language"
            if ! cargo clippy -p openinvar-lang --no-default-features \
                 --features "$language" --all-targets -- -D warnings; then
              echo "::error::openinvar-lang does not build with only '$language' enabled"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
      # Catches missing crate metadata and crates left out of the publish
      # workflow. Without this, both failures surface only during a release,
      # partway through publishing, once earlier crates are already on
      # crates.io and their versions cannot be republished.
      #
      # Only metadata is treated as fatal. A dry run of a crate whose workspace
      # dependencies are not yet on crates.io always fails with "no matching
      # package found" — that resolves itself at release time, because the
      # publish workflow pushes crates in dependency order.
      - name: Verify every crate has publishable metadata
        run: |
          status=0
          for crate in $(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print("\n".join(p["name"] for p in json.load(sys.stdin)["packages"]))'); do
            if cargo publish -p "$crate" --dry-run --no-verify --allow-dirty 2>&1 \
              | grep -qi "manifest has no description\|missing or empty metadata"; then
              echo "::error::$crate is missing required crates.io metadata (description/license/repository)"
              status=1
            fi
          done
          exit $status

      # Every workspace crate must appear in the release workflow, or a release
      # publishes a partial set and the CLI fails to build from crates.io.
      - name: Verify the publish workflow covers every crate
        run: |
          python3 - <<'EOF'
          import json, pathlib, re, subprocess, sys

          meta = json.loads(subprocess.run(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"],
              capture_output=True, text=True, check=True).stdout)
          crates = {p["name"] for p in meta["packages"]}
          workflow = pathlib.Path(".github/workflows/publish_crates.yml").read_text()
          published = set(re.findall(r"cargo publish -p (\S+)", workflow))

          missing = sorted(crates - published)
          if missing:
              print(f"::error::not in publish_crates.yml: {', '.join(missing)}")
              sys.exit(1)
          print(f"all {len(crates)} crates are covered")
          EOF
