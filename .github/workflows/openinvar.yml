# OpenInvar analyzing OpenInvar — the action's own integration test.
#
# The action is the distribution vehicle, and the only honest way to know it
# works is to run it. This workflow runs it on every pull request to this
# repository, from source rather than from a release, so a change to the action
# is exercised by the pull request that makes it.
#
# It gates merges here. `openinvar.toml` at the root holds this repository's
# own architectural rules, and a change that breaks one does not merge — the
# same thing it asks of anyone else's repository.
#
# `--require-rules` is deliberate: if that file ever goes missing, this job
# fails rather than passing with nothing enforced. A gate that stops enforcing
# without saying so is the exact failure the project exists to prevent.
name: OpenInvar

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Both sides of the comparison have to exist locally.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: ./
        with:
          version: source
          require-rules: 'true'
          fail-on-violation: 'true'
