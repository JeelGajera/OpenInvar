name: Publish to Crates.io

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Crates.io via Trusted Publisher
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # Empty unless the repository sets it, which is what selects between the
      # two paths below. Declared at job level so the auth step's `if:` can
      # read it.
      CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      # Trusted Publishing is the steady state: it exchanges the GitHub Actions
      # OIDC token for a short-lived crates.io token, and no long-lived secret
      # exists anywhere.
      #
      # It cannot do a crate's *first* publish. A trusted publisher is
      # configured on a crate that already exists, so the name has to be claimed
      # once with an ordinary token before OIDC has anything to attach to. That
      # is what `CRATES_IO_TOKEN` is for: set it as a repository secret for the
      # first release, delete it once every crate exists, and this falls back to
      # OIDC automatically whenever it is absent.
      #
      # The secret is read from the repository, never passed in by hand. A token
      # that travels through a chat, an issue or a commit message is disclosed
      # by the act of sending it, whatever happens to it afterwards.
      - name: Authenticate with crates.io
        if: env.CRATES_IO_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Crates must be published in dependency order.
      # `cargo publish` natively waits for the index to update before completing.
      #
      # Order follows the dependency graph:
      #   core → lang → store → mcp → cli
      # A crate published before its dependencies fails with "no matching
      # package found", after earlier crates have already gone out and their
      # versions can no longer be reused.
      #
      # This was ten crates and six of them were language adapters, so every
      # new language lengthened the chain and widened the window in which a
      # release could fail partway through. Adding a language no longer touches
      # this file at all.
      - name: Publish all crates safely to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CRATES_IO_TOKEN != '' && env.CRATES_IO_TOKEN || steps.auth.outputs.token }}
        run: |
          cargo publish -p openinvar-core
          cargo publish -p openinvar-lang
          cargo publish -p openinvar-store
          cargo publish -p openinvar-mcp
          cargo publish -p openinvar-cli
