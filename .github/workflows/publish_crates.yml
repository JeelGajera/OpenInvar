name: Publish to Crates.io

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Crates.io via Trusted Publisher
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      # Automatically exchanges the GitHub Actions OIDC token for a short-lived crates.io token
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Crates must be published in dependency order.
      # `cargo publish` natively waits for the index to update before completing.
      #
      # Order follows the dependency graph:
      #   core → lang → store → mcp → cli
      # A crate published before its dependencies fails with "no matching
      # package found", after earlier crates have already gone out and their
      # versions can no longer be reused.
      #
      # This was ten crates and six of them were language adapters, so every
      # new language lengthened the chain and widened the window in which a
      # release could fail partway through. Adding a language no longer touches
      # this file at all.
      - name: Publish all crates safely to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish -p openinvar-core
          cargo publish -p openinvar-lang
          cargo publish -p openinvar-store
          cargo publish -p openinvar-mcp
          cargo publish -p openinvar-cli
