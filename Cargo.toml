[workspace]
members = [
  "crates/openinvar-core",
  "crates/openinvar-lang",
  "crates/openinvar-store",
  "crates/openinvar-mcp",
  "crates/openinvar-cli",
]
# Test fixtures are analyzed by OpenInvar, not built by Cargo. Several are real
# Cargo packages so that workspace resolution can be exercised against the
# real thing; excluding them keeps them out of this workspace.
exclude = ["fixtures"]
resolver = "2"

[workspace.package]
description = "Deterministic integrity checks for AI-written code — structural violations, test tampering, contract erosion. No model in the loop."
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/JeelGajera/OpenInvar"
homepage = "https://github.com/JeelGajera/OpenInvar"
authors = ["Jeel Gajera"]
categories = ["development-tools", "command-line-utilities", "parser-implementations"]
keywords = ["ci", "code-review", "static-analysis", "agents", "mcp"]
