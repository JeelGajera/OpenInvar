name: 'OpenInvar'
description: 'Deterministic integrity checks for AI-written code — structural violations, test tampering, contract erosion. No model in the loop.'
author: 'OpenInvar Contributors'
branding:
  icon: 'git-merge'
  color: 'purple'

inputs:
  path:
    description: 'Repository root to analyze.'
    required: false
    default: '.'
  version:
    description: >
      Which binary to use. A release tag such as "v0.2.0", "latest" for the
      newest release, or "source" to build from the checked-out tree. Building
      from source takes minutes; a release download takes seconds.
    required: false
    default: 'latest'
  base-ref:
    description: >
      The revision to compare against. Defaults to the pull request base, or
      the push event''s "before" commit.
    required: false
    default: ''
  rules:
    description: 'Rules file. Defaults to <path>/.openinvar/rules.toml.'
    required: false
    default: ''
  comment:
    description: 'Post the report as a pull request comment, updating the previous one.'
    required: false
    default: 'true'
  fail-on-violation:
    description: >
      Fail the job when a rule is violated on resolved evidence, or when the
      audit finds something at or above `audit-severity`. Rules that could not
      be decided never fail the job, whatever this is set to.
    required: false
    default: 'true'
  audit-severity:
    description: >
      Lowest audit severity to report and fail on: `error` or `warn`. Only the
      two high-confidence detectors report at error, so the default blocks on
      those and leaves the rest advisory.
    required: false
    default: 'error'
  github-token:
    description: 'Token used to post the comment.'
    required: false
    default: ${{ github.token }}

outputs:
  verdict:
    description: 'One of: clean, violated, audit, undecided.'
    value: ${{ steps.report.outputs.verdict }}
  report:
    description: 'Path to the markdown report on disk.'
    value: ${{ steps.report.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Install openinvar
      shell: bash
      env:
        OPENINVAR_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: ${{ github.action_path }}/action/install.sh

    - name: Record snapshots and build the report
      id: report
      shell: bash
      env:
        OPENINVAR_PATH: ${{ inputs.path }}
        OPENINVAR_BASE_REF: ${{ inputs.base-ref }}
        OPENINVAR_RULES: ${{ inputs.rules }}
        OPENINVAR_AUDIT_SEVERITY: ${{ inputs.audit-severity }}
      run: ${{ github.action_path }}/action/report.sh

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENINVAR_REPORT: ${{ steps.report.outputs.report-path }}
      run: ${{ github.action_path }}/action/comment.sh

    - name: Fail on violation
      if: inputs.fail-on-violation == 'true' && steps.report.outputs.verdict == 'violated'
      shell: bash
      run: |
        echo "::error::OpenInvar: a rule in .openinvar/rules.toml was violated by this change."
        exit 1

    - name: Fail on audit finding
      if: inputs.fail-on-violation == 'true' && steps.report.outputs.verdict == 'audit'
      shell: bash
      run: |
        echo "::error::OpenInvar: the audit found a change that looks like it was made to pass a check rather than to work."
        exit 1
